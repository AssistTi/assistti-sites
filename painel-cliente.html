<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AssistTI Sites | Meus Sites</title><style>body{margin:0;background:#0e1421;color:#f1f5ff;font-family:system-ui}header{background:#182238;padding:20px;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:45px auto;padding:0 20px}.card{border:1px solid #394765;background:#182238;border-radius:15px;padding:20px;margin:12px 0}button{border:0;background:#536af1;color:white;padding:10px 16px;border-radius:8px;cursor:pointer}input,select{padding:10px;background:#101a2b;color:white;border:1px solid #485775;border-radius:8px;margin:6px}small{color:#a6b7d4}a{color:#b8c6ff}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="auth-config.js"></script></head><body><header><strong>AssistTI Sites | Meus Sites</strong><button onclick="logout()">Sair</button></header><main><h1>Meus sites</h1><p><small>Somente os sites liberados pelo administrador aparecem aqui.</small></p><div id="sites">Carregando...</div><p><small>O editor com login e a publicação automática ainda estão em desenvolvimento.</small></p></main><script>const cfg=window.ASSISTTI_AUTH||{};if(!cfg.url||!cfg.anonKey)location.replace('login.html');const sb=window.supabase.createClient(cfg.url,cfg.anonKey);async function start(){const {data:{user}}=await sb.auth.getUser();if(!user){location.replace('login.html');return}const {data:p}=await sb.from('profiles').select('role,email').eq('id',user.id).single();if(!p){location.replace('login.html');return}return {user,profile:p}}async function logout(){await sb.auth.signOut();location.replace('login.html')}
async function load(){const r=await start();if(!r)return;if(r.profile.role==='admin'){location.replace('painel-admin.html');return}const {data,error}=await sb.from('site_access').select('can_edit,can_publish,sites(id,name,repository)').eq('user_id',r.user.id);const target=document.getElementById('sites');if(error){target.textContent='Não foi possível carregar os sites.';return}target.innerHTML='';for(const item of data||[]){if(!item.sites)continue;const div=document.createElement('div');div.className='card';const h=document.createElement('h3');h.textContent=item.sites.name;div.append(h);const p=document.createElement('p');p.textContent='Editar: '+(item.can_edit?'Permitido':'Não permitido')+' | Publicar: '+(item.can_publish?'Permitido':'Não permitido');div.append(p);target.append(div)}if(!target.children.length)target.textContent='Nenhum site liberado para sua conta.'}load();
</script></body></html>

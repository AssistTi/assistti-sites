<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AssistTI Sites | Acesso</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 75% 10%,#283a7c,#0b1220 50%);color:#f4f6ff;font-family:system-ui;padding:20px}
.card{width:min(100%,430px);padding:35px;border-radius:22px;background:#151e30;border:1px solid #33425b;box-shadow:0 24px 80px #03071280}
h1{font-size:27px;margin:0 0 8px}p{color:#a7b6d2;line-height:1.5;margin:0 0 26px}label{display:block;font-size:13px;margin:16px 0 7px}input{width:100%;padding:13px;background:#0c1322;border:1px solid #41506a;border-radius:10px;color:white;font:inherit}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:10px;background:#536af1;color:white;font:700 15px system-ui;cursor:pointer}button:disabled{opacity:.5}.message{margin-top:16px;font-size:13px;color:#d5b9ff;line-height:1.6}.brand{font-weight:800;letter-spacing:.03em;margin-bottom:26px}.brand span{color:#899cff}
</style></head><body><div class="card"><div class="brand">Assist<span>TI</span> Sites</div><h1>Entrar no painel</h1><p>Use o e-mail e a senha cadastrados pelo administrador.</p><form id="form"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required><button id="enter" type="submit">Entrar</button></form><div id="message" class="message" role="status"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="auth-config.js"></script><script>
const msg=document.getElementById('message'),cfg=window.ASSISTTI_AUTH||{};
if(!cfg.url||!cfg.anonKey){msg.textContent='Login em preparação. O administrador precisa conectar o Supabase.';document.getElementById('enter').disabled=true}
else{const sb=window.supabase.createClient(cfg.url,cfg.anonKey);
document.getElementById('form').onsubmit=async e=>{e.preventDefault();msg.textContent='Verificando acesso...';const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error){msg.textContent='Não foi possível entrar. Confira o e-mail e a senha.';return}const {data:profile,error:pe}=await sb.from('profiles').select('role').eq('id',data.user.id).single();if(pe||!profile){await sb.auth.signOut();msg.textContent='Conta ainda não liberada pelo administrador.';return}location.href=profile.role==='admin'?'painel-admin.html':'painel-cliente.html'};
}
</script></body></html>

<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AssistTI Sites | Painel</title>
<style>
:root{--bg:#0c1220;--panel:#151e30;--panel2:#1c2940;--line:#2c3a52;--text:#f1f5ff;--muted:#99abc8;--accent:#6478f5;--ok:#47c79a;--danger:#ef7282}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,Arial}button,input,select{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
aside{padding:22px 15px;border-right:1px solid var(--line);background:#111b2b;display:flex;flex-direction:column;gap:20px}
.brand{padding:8px 10px;font-size:20px;font-weight:850;letter-spacing:-.045em}.brand span{color:#8a9bff}.brand small{font-size:11px;color:var(--muted);display:block;font-weight:500;letter-spacing:0}
.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:12px;border:0;color:#a9bad4;background:transparent;border-radius:10px;padding:13px;text-align:left;font-weight:650;width:100%}.nav button:hover,.nav button.active{background:#283854;color:#fff}.nav .ico{width:23px;text-align:center;color:#a4b4fd}
.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:20px 9px 0;font-size:12px;color:var(--muted)}.sidefoot strong{display:block;color:#fff;overflow-wrap:anywhere}
main{min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:#131e30;padding:19px clamp(18px,3vw,38px)}.top h1{font-size:22px;margin:0;letter-spacing:-.045em}.top p{margin:3px 0 0;color:var(--muted);font-size:12px}.tag{border:1px solid #45619a;background:#243657;color:#b6cbff;border-radius:30px;padding:5px 11px;font-size:11px;font-weight:750}
.content{padding:clamp(18px,3vw,36px);max-width:1500px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:21px;min-width:0;box-shadow:0 10px 30px #00000013}.kpi small{display:block;color:var(--muted);font-size:12px}.kpi strong{font-size:31px;display:block;margin:9px 0 0;letter-spacing:-.05em}.kpi span{font-size:11px;color:#92a7ca}
.section{margin-top:26px}.sectiontitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}.sectiontitle h2{font-size:17px;margin:0}.muted{color:var(--muted)}.btn{border:1px solid #435373;background:#25334b;color:#fff;border-radius:10px;padding:10px 15px;font-size:12px;font-weight:750}.btn:hover{background:#324567}.btn.primary{background:var(--accent);border-color:var(--accent)}.btn.primary:hover{background:#798aff}.btn.soft{background:#1c2840}.btn.danger{color:#ffc3cb;border-color:#744453;background:#492d3c}.btn:disabled{opacity:.45;cursor:not-allowed}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}.list{display:grid;gap:11px}.siteitem{display:flex;align-items:center;justify-content:space-between;gap:13px;border:1px solid #314059;border-radius:13px;padding:16px;background:#19243a}.sitethumb{width:48px;height:48px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(140deg,#444f9a,#6b3c9b);font-size:23px;font-weight:850;flex:0 0 auto}.sitemeta{flex:1;min-width:0}.sitemeta strong{display:block;font-size:15px}.sitemeta small{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.status{display:inline-block;font-size:11px;font-weight:700;padding:5px 9px;border-radius:15px;color:#98eccd;background:#153b37}
input,select{width:100%;padding:11px 13px;background:#0e1829;border:1px solid #3c4b65;border-radius:10px;color:#f7faff;outline:none}input:focus,select:focus{border-color:#788dff;box-shadow:0 0 0 3px #788dff26}
label{display:block;color:#b8c6dd;font-size:12px;font-weight:700;margin-bottom:7px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.formrow{margin-bottom:16px}.hint{font-size:12px;color:var(--muted);line-height:1.6}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:540px}th{text-align:left;font-size:11px;letter-spacing:.03em;color:var(--muted);font-weight:750;padding:12px;border-bottom:1px solid #36465e}td{padding:13px 12px;border-bottom:1px solid #283950;overflow-wrap:anywhere}td button{padding:7px 9px}.toolbar{display:flex;gap:10px;margin-bottom:17px}.toolbar input{max-width:380px}.hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:32px 15px;background:#172238;border:1px dashed #41506c;border-radius:12px}.notice{padding:13px 17px;border-radius:10px;background:#273a5b;color:#d0dfff;margin-bottom:18px}.notice.error{background:#5b2d39;color:#ffbec6}.notice.ok{background:#1d4b3e;color:#b9ffe4}
.modalroot{position:fixed;inset:0;background:#080d19b8;z-index:30;display:grid;place-items:center;padding:18px}.modal{background:#18243a;border:1px solid #43516a;border-radius:18px;padding:25px;width:min(540px,100%);max-height:90vh;overflow:auto}.modal h2{margin:0 0 20px;font-size:20px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.app{grid-template-columns:210px minmax(0,1fr)}}
@media(max-width:700px){.app{display:block}aside{padding:10px;gap:7px}.brand{font-size:17px}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap;padding:10px 12px}.sidefoot{display:none}.top{padding:15px}.content{padding:16px}.formgrid{grid-template-columns:1fr}.siteitem{flex-wrap:wrap}.siteitem .flex{width:100%}.grid{gap:9px}.card{padding:14px}.kpi strong{font-size:24px}}
</style><link rel="stylesheet" href="dashboard-modern.css"></head>
<body><div class="app"><aside><div class="brand">Assist<span>TI</span> Sites<small>Seu estúdio de sites</small></div>
<nav class="nav" id="nav">
<button data-tab="inicio" class="active"><span class="ico">▦</span>Visão geral</button>
<button data-tab="sites"><span class="ico">◈</span>Meus sites</button>
<button data-tab="clientes" class="admin-only"><span class="ico">♙</span>Clientes e acessos</button>
<button data-tab="permissoes" class="admin-only"><span class="ico">▣</span>Permissões</button><button data-tab="publicacao" class="admin-only"><span class="ico">↑</span>Publicações</button>
<button data-tab="backups"><span class="ico">◷</span>Backups de páginas</button>
<button data-tab="conta"><span class="ico">⚙</span>Minha conta</button>
</nav><div class="sidefoot"><strong id="sideEmail">Carregando...</strong><span id="sideRole"></span><p><button class="btn soft" id="logout">Sair da conta</button></p></div></aside>
<main><header class="top"><div><h1 id="pageTitle">Visão geral</h1><p id="pageSubtitle">Acompanhe seus sites em um só lugar.</p></div><span class="tag" id="roleTag">Verificando acesso</span></header><div class="content"><div id="alert"></div><div id="view"></div></div></main></div><div id="modalHost"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-config.js"></script><script src="dashboard.js"></script></body></html>

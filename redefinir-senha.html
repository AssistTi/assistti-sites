<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AssistTI Sites | Redefinir senha</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101827;color:#f0f5ff;font:15px system-ui;padding:20px}.panel{background:#1a263b;border:1px solid #3e5074;padding:32px;border-radius:18px;width:min(440px,100%)}input,button{width:100%;padding:13px;border-radius:9px;margin-top:12px;font:inherit}input{background:#0f1828;color:white;border:1px solid #4f6080}button{background:#6074f3;color:white;border:0;cursor:pointer}small{color:#b9c8e0}a{color:#b8c7ff}</style></head><body><div class="panel"><h1>Redefinir senha</h1><p>Escolha uma senha nova para sua conta AssistTI Sites.</p><form id="form"><input id="password" type="password" autocomplete="new-password" placeholder="Nova senha (mín. 8 caracteres)" minlength="8" required><input id="confirm" type="password" autocomplete="new-password" placeholder="Confirme a senha" required><button type="submit">Salvar nova senha</button></form><p id="status"></p><small><a href="login.html">Voltar ao login</a></small></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="auth-config.js"></script><script>const c=window.ASSISTTI_AUTH||{},msg=document.getElementById('status');if(c.url&&c.anonKey){const sb=window.supabase.createClient(c.url,c.anonKey);document.getElementById('form').onsubmit=async e=>{e.preventDefault();if(document.getElementById('password').value!==document.getElementById('confirm').value){msg.textContent='As senhas não são iguais.';return}const{error}=await sb.auth.updateUser({password:document.getElementById('password').value});msg.textContent=error?'Não foi possível atualizar. Abra novamente o link de recuperação enviado por e-mail.':'Senha atualizada. Você já pode entrar no painel.'}}else{msg.textContent='Serviço de autenticação indisponível.'}</script></body></html>
